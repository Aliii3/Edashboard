<script>

const money=n=>new Intl.NumberFormat('en-EG',{maximumFractionDigits:0}).format(n||0), egp=n=>'EGP '+money(n), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names=['Ahmed Samir','Sara Hassan','Omar Mostafa','Nour Adel','Mariam Khaled','Youssef Ali','Farah Ibrahim','Karim Nabil','Hana Mahmoud','Tarek Fathy','Salma Hossam','Leila Yasser'];

return {version:VERSION,products,customers,campaigns,orders,materials:[{name:'Fabric (m)',stock:210,cost:90},{name:'Trims kits',stock:170,cost:25},{name:'Packaging kits',stock:150,cost:30}],batches:[{id:'MO-201',product:'LIN-OLV',qty:12,status:'WIP',due:'2026-11-06'},{id:'MO-202',product:'SET-OAT',qty:8,status:'Planned',due:'2026-11-08'}],movements:[{date:'2026-11-03',sku:'LIN-OLV',qty:-24,kind:'Fabric consumed · MO-201',unit:'m'},{date:'2026-11-02',sku:'TEE-IVR',qty:30,kind:'Production receipt · MO-198',unit:'units'}],expenses:[{id:1,name:'Studio rent allocation',category:'Overheads',amount:1600,date:'2026-11-01'},{id:2,name:'Packing team overtime',category:'Operations',amount:450,date:'2026-11-02'}],cases:[{id:'EX-001',order:1070,reason:'Size exchange: M → L',status:'Requested'}],audit:[{date:'2026-11-04 09:15',text:'Demo workspace loaded · sample orders and stock balances'}],settings:{company:'Nile Studio',tolerance:0,role:'Owner',sources:{Shopify:'CSV',Meta:'Manual',Couriers:'Manual',Payments:'CSV'}},milestones:{}};
}
function gross(o){return o.qty*o.price-o.discount}
function revenue(o){return finished.includes(o.status)?(o.qty-o.refundQty)*(o.price-o.discount/o.qty):0}
function cogs(o){return finished.includes(o.status)?(o.qty-o.refundQty)*o.unitCost:0}
function expected(o){return finished.includes(o.status)?Math.max(0,revenue(o)-o.shipping-o.fee):0}
let storageOK=true, db;try{db=JSON.parse(localStorage.getItem(KEY));if(!db||db.version!==VERSION)db=seed()}catch{db=seed();storageOK=false}
let page='overview',selected=1058,customerId=1,inventoryTab='Finished goods',financeTab='Profit & loss',filters={q:'',status:'All statuses',courier:'All couriers',collection:'All collections',campaign:'All campaigns',period:'All dates'},selectedOrders=new Set(),crmQuery='',crmSegment='All customers',overviewPeriod='All dates',campaignFocus=0;
function save(message){db.audit.unshift({date:new Date().toLocaleString('en-GB'),text:message+' · Demo operator'});try{localStorage.setItem(KEY,JSON.stringify(db))}catch{storageOK=false}render();toast(message+(storageOK?'':' — session only; browser storage unavailable'))}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.add('hidden'),4500)}
function customer(o){return db.customers.find(c=>c.id===o.customer)}function product(o){return db.products.find(p=>p.id===o.product)}
function camp(id){return db.campaigns.find(c=>c.id===id)}function campaignName(id){return camp(id)?.name||'Organic / unassigned'}
function allocation(o){let c=camp(o.campaign);return c?c.spend/db.orders.filter(x=>x.campaign===c.id).length:0}
function contribution(o){return revenue(o)-cogs(o)-o.shipping-o.fee-allocation(o)}
function collection(o){let e=expected(o);if(!finished.includes(o.status))return o.received?'Refund review':'Not due';let diff=e-o.received;return Math.abs(diff)<=Number(db.settings.tolerance)?'Reconciled':diff<0?'Overpaid':o.received>0?'Short payment':'Pending'}
function badge(text){let col=['Delivered','Reconciled','Completed','VIP'].includes(text)?'green':['Failed Delivery','Returned','Short payment','Overpaid','Refund review'].includes(text)?'red':['New','Pending','Ready','Follow up','Planned'].includes(text)?'orange':['Shipped','WIP','Confirmed','CSV'].includes(text)?'blue':['Partially Returned','Exchange'].includes(text)?'purple':'';return `<span class="badge ${col}">${esc(text)}</span>`}
const sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0);
function metrics(orders=db.orders){return {gross:sum(orders,gross),rev:sum(orders,revenue),cogs:sum(orders,cogs),cash:sum(orders,o=>o.received),shipping:sum(orders,o=>o.shipping),fees:sum(orders,o=>o.fee),expected:sum(orders,expected),ads:sum(orders,allocation)}}
function metric(label,value,sub){return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><small>${sub}</small></div>`}
function card(title,body,sub='',action=''){return `<section class="card"><div class="cardhead"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${action}</div>${body}</section>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No records match these filters.</td></tr>`}</tbody></table></div>`}
function opts(values,current){return values.map(x=>`<option ${x===current?'selected':''}>${esc(x)}</option>`).join('')}
function heading(title,desc,buttons=''){return `<div class="heading"><div><div class="eyebrow">COMMERCE OPERATIONS</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${buttons}</div></div>`}
function orderLink(o){return `<button class="link" onclick="openOrder(${o.id})">#${o.id}</button>`}
const navItems=[['overview','◫','Overview'],['orders','▤','Orders'],['order360','◎','Order 360'],['crm','♧','CRM'],['inventory','▦','Inventory / Production'],['shipping','▱','Shipping'],['finance','◈','Finance'],['campaigns','↗','Campaigns'],['settings','⚙','Settings / Data Sources'],['roadmap','≋','Roadmap']];
function go(p){page=p;location.hash=p;render();window.scrollTo(0,0)}function openOrder(id){selected=id;go('order360')}function openCustomer(id){customerId=id;go('crm')}
window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(navItems.some(n=>n[0]===p)&&page!==p){page=p;render()}});
function render(){document.getElementById('workspaceName').textContent=db.settings.company;document.getElementById('nav').innerHTML=navItems.map(([p,icon,name])=>`<a href="#${p}" title="${name}" aria-label="${name}" class="${page===p?'active':''}" ${page===p?'aria-current="page"':''} onclick="go('${p}');return false">${uiIcon(p)}<span class="nav-title">${name}</span></a>`).join('');document.getElementById('main').innerHTML=views[page]()+`<div class="footerhint">Interactive prototype · Fictional data · ${storageOK?'Changes save in this browser.':'Changes last for this session only.'} All amounts in EGP. No live integrations, messages or payments.</div>`}
function dateMatch(o,period){return period==='All dates'||(period==='November 2026'?o.date.startsWith('2026-11'):o.date.startsWith('2026-10'))}
let overviewTablePage=0;
function searchWorkspace(query){filters.q=query.trim();filters.status='All statuses';filters.courier='All couriers';filters.collection='All collections';filters.campaign='All campaigns';filters.period='All dates';go('orders')}
function uiIcon(key){const paths={overview:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',orders:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h4"/>',order360:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3"/>',crm:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m1-16a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v3"/>',inventory:'<path d="m12 3 9 5v10l-9 5-9-5V8Zm0 10v10M3 8l9 5 9-5M7 5l10 6v5"/>',shipping:'<path d="M3 5h12v12H3m12-8h4l3 4v4h-7M1 9h7m-7 4h5"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',finance:'<rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 5V3h8v2M8 15v3m4-6v6m4-9v9"/>',campaigns:'<path d="M3 11v5h4l10 4V5L7 10H4a1 1 0 0 0-1 1Zm4 5 2 6h3l-2-5M20 9l2-2m-2 7h3"/>',settings:'<path d="m9 3 1-2h4l1 2 3 2 2 1v4l-2 2v3l-1 3-3 1-2 2-3-2-3-1-1-3v-3L3 10V6l3-1Z"/><circle cx="12" cy="11" r="3"/>',roadmap:'<path d="M5 3v18M5 5h14l-3 4 3 4H5"/>',money:'<path d="m8 3 2 4h4l2-4ZM10 7C6 10 4 14 5 18s13 4 14 0-1-8-5-11"/><path d="M14 12h-3a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4M12 10v2m0 8v1"/>',bag:'<rect x="5" y="7" width="14" height="15" rx="3"/><path d="M9 8V5a3 3 0 0 1 6 0v3"/>',clock:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',alert:'<circle cx="12" cy="12" r="8"/><path d="M12 7v6m0 3v1"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[key]||paths.orders}</svg>`}
function overview(){let os=db.orders.filter(o=>dateMatch(o,overviewPeriod)),m=metrics(os),shipped=os.filter(o=>o.shipped).length,delivered=os.filter(o=>finished.includes(o.status)).length,newCount=os.filter(o=>o.status==='New').length,profit=m.rev-m.cogs-m.shipping-m.fees-m.ads;
let kpis=[['money','Recognized revenue',egp(m.rev),'Retained delivered items','finance'],['shipping','Orders shipped',shipped,'Includes completed shipments','shipping'],['inventory','Orders delivered',delivered,'Includes partially returned orders','orders'],['bag','New orders',newCount,'Awaiting confirmation','orders']];
let insights=[['clock','Awaiting processing',os.filter(o=>['Confirmed','Processing'].includes(o.status)).length,'orders','Confirmed'],['alert','Failed delivery attempts',os.filter(o=>o.status==='Failed Delivery').length,'orders','Failed Delivery'],['clock','Pending collections',os.filter(o=>collection(o)==='Pending').length,'finance',''],['bag','Ready to ship',os.filter(o=>o.status==='Ready').length,'orders','Ready'],['shipping','Out for delivery',os.filter(o=>o.status==='Shipped').length,'orders','Shipped']];
let pages=Math.max(1,Math.ceil(os.length/6));overviewTablePage=Math.min(overviewTablePage,pages-1);let shown=os.slice(overviewTablePage*6,overviewTablePage*6+6);
return `<section class="panel"><div class="panel-head"><h2>KPI Summary <span class="info" title="Calculated from the selected order cohort">ⓘ</span></h2><div class="actions"><select aria-label="Overview date range" onchange="overviewPeriod=this.value;overviewTablePage=0;render()">${opts(['All dates','October 2026','November 2026'],overviewPeriod)}</select><button class="round" aria-label="Open finance" onclick="go('finance')">↗</button></div></div><div class="reference-kpis">${kpis.map(([icon,label,value,sub,target])=>`<button class="reference-kpi" onclick="go('${target}')"><span class="metric-icon">${uiIcon(icon)}</span><div class="metric-label-value"><div class="label">${label}</div><div class="value">${value}</div><small>${sub}</small></div><span class="info">ⓘ</span></button>`).join('')}</div></section><section class="panel"><div class="panel-head"><h2>Insights & performance <span class="info" title="Operational counts, not invented month-over-month changes">ⓘ</span></h2><div class="actions"><span class="pill">${os.length} orders in view</span><button class="round" aria-label="Open all orders" onclick="go('orders')">↗</button></div></div><div class="insight-grid">${insights.map(([icon,label,count,target,status])=>`<button class="insight" onclick="filters.status='${status||'All statuses'}';filters.period=overviewPeriod;${target==='finance'?"financeTab='Reconciliation';":''}go('${target}')"><div class="insight-top">${uiIcon(icon)}<div><div class="insight-title">${label}</div><div class="insight-count">${count}</div></div></div><div class="insight-detail"><span>Selected period</span><b>${Math.round(count/Math.max(1,os.length)*100)}%</b></div><div class="segmented"><i style="width:${count/Math.max(1,os.length)*100}%"></i></div><div class="insight-bottom"><div>Matching orders<strong>${count}</strong></div><div>All orders<strong>${os.length}</strong></div></div></button>`).join('')}</div></section><section class="panel"><div class="panel-head"><h2>Your orders update <span class="info">ⓘ</span></h2><button class="round" aria-label="Open orders workspace" onclick="go('orders')">↗</button></div><div class="reference-table">${table(['Order ID','Product name','Customer name','Fulfillment','Collection update','Status','Actions'],shown.map(o=>`<tr><td>${orderLink(o)}</td><td>${esc(product(o).name)}<br><small>${esc(product(o).variant)} · ${o.qty} unit${o.qty>1?'s':''}</small></td><td><button class="link" onclick="openCustomer(${o.customer})">${esc(customer(o).name)}</button><br><small>${customer(o).phone}</small></td><td>${esc(o.courier)}</td><td>${badge(collection(o))}<br><small>Received ${egp(o.received)} · expected ${egp(expected(o))}</small></td><td>${badge(o.status)}</td><td><button class="round" aria-label="Open order ${o.id}" onclick="openOrder(${o.id})">↗</button></td></tr>`).join(''))}</div><div class="table-footer"><button ${overviewTablePage===0?'disabled':''} onclick="overviewTablePage--;render()">← &nbsp; Previous</button><span>Page ${overviewTablePage+1} of ${pages} · ${os.length} orders · fictional demo data</span><button ${overviewTablePage>=pages-1?'disabled':''} onclick="overviewTablePage++;render()">Next &nbsp; →</button></div></section><div class="grid equal detail-grid">${card('Cash & contribution',`<div class="pad">${[['Recognized revenue',m.rev],['Net cash received',m.cash],['Outstanding net collections',sum(os,o=>Math.max(0,expected(o)-o.received))],['Order contribution before overhead',profit]].map(([t,v])=>`<div class="row"><span>${t}</span><strong>${egp(v)}</strong></div>`).join('')}<p class="inlinehelp">Revenue, cash, and profit remain separate. Company overhead is included in Finance.</p></div>`,'Calculated from the selected order cohort',`<button class="round" aria-label="View finance" onclick="go('finance')">↗</button>`)}${card('Keep your operation moving',`<div class="pad"><div class="row"><span>Products below reorder point</span><button class="link" onclick="go('inventory')">${db.products.filter(p=>available(p)<p.min).length} products →</button></div><div class="row"><span>Manual capture & CSV imports</span><button onclick="newOrder()">+ New order</button></div><div class="row"><span>Manage courier assignments</span><button class="link" onclick="go('shipping')">Open shipping →</button></div><div class="row"><span>Campaign attribution & spend</span><button class="link" onclick="go('campaigns')">View campaigns →</button></div></div>`,'Manual-first. Integrations are optional.')}</div>`}
function filteredOrders(){return db.orders.filter(o=>(!filters.q||[o.id,customer(o).name,customer(o).phone,product(o).name].join(' ').toLowerCase().includes(filters.q.toLowerCase()))&&(filters.status==='All statuses'||o.status===filters.status)&&(filters.courier==='All couriers'||o.courier===filters.courier)&&(filters.collection==='All collections'||collection(o)===filters.collection)&&(filters.campaign==='All campaigns'||String(o.campaign)===filters.campaign)&&dateMatch(o,filters.period))}
function orderTable(os,checks=true){return table([...(checks?['<input aria-label="Select all visible orders" type="checkbox" onchange="selectAll(this.checked)">']:[]),'Order / date','Customer','Item','Source / campaign','Fulfillment','Collection','Value','Contribution'],os.map(o=>`<tr>${checks?`<td><input aria-label="Select order ${o.id}" type="checkbox" ${selectedOrders.has(o.id)?'checked':''} onchange="toggleOrder(${o.id},this.checked)"></td>`:''}<td>${orderLink(o)}<br><small>${o.date}</small></td><td><button class="link" onclick="openCustomer(${o.customer})">${esc(customer(o).name)}</button><br><small>${esc(customer(o).city)}</small></td><td>${esc(product(o).name)} × ${o.qty}<br><small>${esc(o.product)}</small></td><td>${badge(o.source)} <small>${esc(o.channel)}</small><br><small>${esc(campaignName(o.campaign))}</small></td><td>${badge(o.status)}<br><small>${esc(o.courier)}</small></td><td>${badge(collection(o))}</td><td class="number">${money(gross(o))}</td><td class="number ${contribution(o)<0?'negative':'positive'}">${money(contribution(o))}</td></tr>`).join(''))}
function orders(){let os=filteredOrders();return heading('Orders','One record for every order, regardless of how it arrives.',`<button onclick="exportOrders()">↓ Export filtered CSV</button><button onclick="importModal()">Import CSV</button><button class="primary" onclick="newOrder()">+ New order</button>`)+`<div class="grid kpis">${metric('Total orders',db.orders.length,'Across all sources')}${metric('Awaiting fulfillment',db.orders.filter(o=>['New',...active].includes(o.status)).length,'New, confirmed, processing or ready')}${metric('On the road',db.orders.filter(o=>['Shipped','Failed Delivery'].includes(o.status)).length,'Includes delivery exceptions')}${metric('Pending remittance',egp(sum(db.orders,o=>Math.max(0,expected(o)-o.received))),'Expected net less cash received')}</div><section class="card"><div class="filters"><input aria-label="Search orders" placeholder="Search order, name, phone or product…" value="${esc(filters.q)}" onchange="filters.q=this.value;render()"><select aria-label="Order status" onchange="filters.status=this.value;render()">${opts(['All statuses',...statuses],filters.status)}</select><select aria-label="Collection status" onchange="filters.collection=this.value;render()">${opts(['All collections','Pending','Reconciled','Short payment','Overpaid','Refund review','Not due'],filters.collection)}</select><select aria-label="Courier filter" onchange="filters.courier=this.value;render()">${opts(['All couriers','Bosta','Mylerz','Internal driver'],filters.courier)}</select><select aria-label="Campaign filter" onchange="filters.campaign=this.value;render()"><option>All campaigns</option>${[{id:0,name:'Organic / unassigned'},...db.campaigns].map(c=>`<option value="${c.id}" ${filters.campaign===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select aria-label="Order date" onchange="filters.period=this.value;render()">${opts(['All dates','October 2026','November 2026'],filters.period)}</select><button onclick="filters={q:'',status:'All statuses',courier:'All couriers',collection:'All collections',campaign:'All campaigns',period:'All dates'};render()">Clear</button></div><div class="filters"><span class="muted">${os.length} matching orders · <span id="selectionCount">${selectedOrders.size}</span> selected</span><button onclick="bulkConfirm()">Confirm selected</button><button onclick="bulkCourier()">Assign courier</button></div>${orderTable(os)}</section><p class="inlinehelp">Search applies on Enter or when leaving the field. Bulk confirmation accepts New orders only; invalid selections are skipped and reported.</p>`}
function toggleOrder(id,on){on?selectedOrders.add(id):selectedOrders.delete(id);document.getElementById('selectionCount').textContent=selectedOrders.size}function selectAll(on){filteredOrders().forEach(o=>on?selectedOrders.add(o.id):selectedOrders.delete(o.id));render()}
function reserved(p){return sum(db.orders.filter(o=>o.product===p.id&&active.includes(o.status)&&!o.shipped),o=>o.qty)}function available(p){return p.stock-reserved(p)}
function order360(){let o=db.orders.find(o=>o.id===selected)||db.orders[0],c=customer(o),p=product(o),m=expected(o),seq=['New','Confirmed','Processing','Ready','Shipped','Delivered'],index=seq.indexOf(o.status);return heading(`Order #${o.id}`,`${o.date} · ${o.channel} · ${o.source} capture`, `<select aria-label="Choose order" onchange="selected=Number(this.value);render()">${db.orders.map(x=>`<option value="${x.id}" ${x.id===o.id?'selected':''}>#${x.id} · ${esc(customer(x).name)}</option>`).join('')}</select><button onclick="statusModal(${o.id})">Update status</button><button class="primary" onclick="settlementModal(${o.id})">Record collection</button>`)+`<div class="stepper">${seq.map((s,i)=>`<div class="step ${i===index?'current':i>index?'future':''}">${i+1} &nbsp; ${s}</div>`).join('')}</div>${index===-1?`<div class="note warning">Exception workflow: ${badge(o.status)}. Accepted returned units: ${o.refundQty}. ${o.status==='Exchange'?'The exchange request is tracked separately; the original sale remains recognized until a return is accepted.':''}</div>`:''}<div class="grid kpis">${metric('Order value',egp(gross(o)),o.qty+' ordered units · after discount')}${metric('Recognized revenue',egp(revenue(o)),(finished.includes(o.status)?o.qty-o.refundQty:0)+' retained delivered units')}${metric('Cash received',egp(o.received),collection(o))}${metric('Order contribution',egp(contribution(o)),'Before company overhead')}</div><div class="grid cols"><div class="grid">${card('Items & costs',table(['Product','Qty','Unit price','Unit COGS','Line value'],`<tr><td>${esc(p.name)}<br><small>${esc(p.variant)} · ${p.id}</small></td><td>${o.qty}</td><td>${egp(o.price)}</td><td>${egp(o.unitCost)}</td><td>${egp(o.price*o.qty)}</td></tr>`)+`<div class="pad"><div class="row"><span>Order discount</span><strong>− ${egp(o.discount)}</strong></div><div class="row"><span>Accepted returns</span><strong>${o.refundQty} units · ${egp(o.refundQty*(o.price-o.discount/o.qty))}</strong></div><p class="inlinehelp">Price and COGS are snapshots taken when the order is created. Returns reverse revenue and COGS for resellable items.</p><div class="actions" style="margin-top:15px"><button onclick="returnModal(${o.id})">Accept return</button><button onclick="exchangeModal(${o.id})">Request exchange</button></div></div>`)}${card('Collection reconciliation',`<div class="pad">${[['Recognized customer amount',revenue(o)],['Courier shipping deduction',-o.shipping],['COD fee deduction',-o.fee],['Net expected settlement',m],['Actual net remitted',o.received],['Outstanding / (overpaid)',m-o.received]].map(([t,v])=>`<div class="row"><span>${t}</span><strong>${egp(v)}</strong></div>`).join('')}<div style="margin-top:12px">${badge(collection(o))} <small>Each payment requires a unique reference for this order.</small></div></div>`+table(['Reference','Date','Net amount'],o.settlements.map(x=>`<tr><td>${esc(x.ref)}</td><td>${x.date}</td><td>${egp(x.amount)}</td></tr>`).join('')))}${card('Activity & notes',`<div class="pad"><div class="timeline">${[...o.events].reverse().map(e=>`<div class="event"><strong>${esc(e.text)}</strong><p>${esc(e.date)} · Demo operator</p></div>`).join('')}</div>${o.notes.map(n=>`<div class="note">${esc(n)}</div>`).join('')}<button onclick="noteModal('order',${o.id})">+ Add internal note</button></div>`)}</div><div class="grid" style="align-content:start">${card('Customer',`<div class="pad"><div class="profile"><span class="avatar">${c.name.split(' ').map(x=>x[0]).join('')}</span><div><h2>${esc(c.name)}</h2>${badge(c.tag)}</div></div><div class="row"><span>Phone</span><strong>${c.phone}</strong></div><p class="subtitle">${esc(c.address)}</p><button style="margin-top:18px" onclick="openCustomer(${c.id})">Open customer profile →</button></div>`)}${card('Attribution & fulfillment',`<div class="pad"><div class="row"><span>Campaign</span><strong>${esc(campaignName(o.campaign))}</strong></div><div class="row"><span>Attribution method</span><span>Manual, single campaign</span></div><div class="row"><span>Marketing allocation</span><strong>${egp(allocation(o))}</strong></div><div class="row"><span>Courier / driver</span><strong>${esc(o.courier)}</strong></div><div class="row"><span>Delivery status</span>${badge(o.status)}</div><div class="actions" style="margin-top:15px"><button onclick="attributionModal(${o.id})">Edit attribution</button><button onclick="courierModal([${o.id}])">Assign courier</button></div></div>`)}${card('Profitability breakdown',`<div class="pad">${[['Retained sales',revenue(o)],['COGS',-cogs(o)],['Shipping',-o.shipping],['Payment fees',-o.fee],['Allocated campaign spend',-allocation(o)],['Contribution',contribution(o)]].map(([l,n])=>`<div class="row"><span>${l}</span><strong class="${n<0?'negative':'positive'}">${egp(n)}</strong></div>`).join('')}<p class="inlinehelp">Campaign spend is spread equally over all attributed orders, including cancelled orders. Cash collection does not create revenue a second time.</p></div>`)}</div></div>`}
function crm(){let cs=db.customers.filter(c=>(!crmQuery||[c.name,c.phone,c.city].join(' ').toLowerCase().includes(crmQuery.toLowerCase()))&&(crmSegment==='All customers'||c.tag===crmSegment)),c=db.customers.find(c=>c.id===customerId)||db.customers[0],os=db.orders.filter(o=>o.customer===c.id),m=metrics(os);return heading('Customer relationships','Purchase history, service context, and value in one place.')+`<div class="grid cols">${card('Customer directory',`<div class="filters"><input aria-label="Search customers" placeholder="Name, phone or city…" value="${esc(crmQuery)}" onchange="crmQuery=this.value;render()"><select aria-label="Customer segment" onchange="crmSegment=this.value;render()">${opts(['All customers','VIP','Regular','Follow up'],crmSegment)}</select></div>`+table(['Customer','Segment','Orders','Recognized sales'],cs.map(x=>`<tr style="${x.id===c.id?'background:#eef6f2':''}"><td><button class="link" onclick="customerId=${x.id};render()">${esc(x.name)}</button><br><small>${x.phone} · ${x.city}</small></td><td>${badge(x.tag)}</td><td>${db.orders.filter(o=>o.customer===x.id).length}</td><td>${egp(sum(db.orders.filter(o=>o.customer===x.id),revenue))}</td></tr>`).join('')),'12 fictional customers · click to inspect')}${card('Customer profile',`<div class="pad"><div class="profile"><span class="avatar">${c.name.split(' ').map(x=>x[0]).join('')}</span><div><h2>${esc(c.name)}</h2><small>Customer C-${String(c.id).padStart(3,'0')}</small></div></div><div class="metricpair"><div><small>Recorded lifetime sales</small><strong>${egp(m.rev)}</strong></div><div><small>Orders</small><strong>${os.length}</strong></div></div><div class="row"><span>Lifetime contribution</span><strong>${egp(sum(os,contribution))}</strong></div><div class="row"><span>Average order value</span><strong>${egp(m.gross/Math.max(os.length,1))}</strong></div><div class="row"><span>Orders with returns</span><strong>${Math.round(os.filter(o=>o.refundQty>0).length/Math.max(os.length,1)*100)}%</strong></div><div class="row"><span>Last order</span><strong>${os.map(o=>o.date).sort().at(-1)||'—'}</strong></div><div class="row"><span>Phone</span><strong>${c.phone}</strong></div><p class="subtitle">${esc(c.address)}</p><label class="field" style="margin-top:16px">Segment<select onchange="setTag(${c.id},this.value)">${opts(['VIP','Regular','Follow up'],c.tag)}</select></label><h3 style="margin-top:22px">Service notes</h3>${c.notes.map(n=>`<div class="row"><div><p>${esc(n.text)}</p><small>${n.date}</small></div></div>`).join('')||'<p class="subtitle">No notes yet.</p>'}<button style="margin-top:15px" onclick="noteModal('customer',${c.id})">+ Log note / contact</button><p class="inlinehelp">Contact history is an internal log. No messages are sent.</p></div>`)}</div>${card(`${esc(c.name)} · Order history`,orderTable(os,false),'Recorded lifetime metrics cover this demo dataset only.')}`}
function inventory(){return heading('Inventory & production','Track materials, work in progress, and stock ready to sell.',`<button onclick="stockModal()">Adjust stock</button><button class="primary" onclick="batchModal()">+ Production order</button>`)+`<div class="grid kpis">${metric('Finished goods on hand',sum(db.products,p=>p.stock),'Physical units at Cairo warehouse')}${metric('Reserved',sum(db.products,reserved),'Confirmed, processing & ready orders')}${metric('Available stock value',egp(sum(db.products,p=>available(p)*p.cost)),'Available units × standard COGS')}${metric('Active production',sum(db.batches.filter(b=>b.status==='WIP'),b=>b.qty),'Units in work in progress')}</div><div class="tabs">${['Finished goods','Raw materials','Production','Costing','Stock movements'].map(t=>`<button class="${inventoryTab===t?'active':''}" onclick="inventoryTab='${t}';render()">${t}</button>`).join('')}</div>${inventoryTab==='Finished goods'?card('Finished goods',table(['SKU / Product','On hand','Reserved','Available','Reorder point','Unit COGS','Stock health'],db.products.map(p=>`<tr><td><strong>${p.id}</strong><br>${p.name} <small>${p.variant}</small></td><td>${p.stock}</td><td>${reserved(p)}</td><td><strong>${available(p)}</strong></td><td>${p.min}</td><td>${egp(p.cost)}</td><td>${badge(available(p)<p.min?'Low stock':'Healthy')}</td></tr>`).join('')),'Reservations begin on confirmation. Dispatch deducts physical stock; accepted resellable returns restore it.'):inventoryTab==='Raw materials'?card('Material balances',table(['Material','On hand','Unit cost','Stock value'],db.materials.map(m=>`<tr><td>${m.name}</td><td>${m.stock.toFixed(1)}</td><td>${egp(m.cost)}</td><td>${egp(m.stock*m.cost)}</td></tr>`).join('')),'Opening balances already include consumption for MO-201. New production starts consume materials.'):inventoryTab==='Production'?`<div class="note">Raw materials → WIP → Finished goods. Starting a batch consumes the bill of materials; completing it receives finished units. Actions cannot run twice.</div>${card('Production orders',table(['Batch','Product','Units','Due','State','Next action'],db.batches.map(b=>`<tr><td>${b.id}</td><td>${b.product}</td><td>${b.qty}</td><td>${b.due}</td><td>${badge(b.status)}</td><td>${b.status!=='Completed'?`<button onclick="advanceBatch('${b.id}')">${b.status==='Planned'?'Start production':'Complete & receive'}</button>`:'Received into stock'}</td></tr>`).join('')),'Prototype assumes no scrap and one warehouse.')}`:inventoryTab==='Costing'?card('Standard product cost sheets',table(['Product','Fabric','Trims','Packaging','Labor / overhead','Total unit COGS','Sale price','Unit gross margin'],db.products.map(p=>`<tr><td>${p.name}<br><small>${p.id}</small></td><td>${p.bom} m × 90</td><td>25</td><td>30</td><td>${money(p.cost-p.bom*90-55)}</td><td>${egp(p.cost)}</td><td>${egp(p.price)}</td><td>${Math.round((p.price-p.cost)/p.price*100)}%</td></tr>`).join('')),'Standard BOM: fabric + one trims kit + one packaging kit per unit. Labor/overhead balances to standard cost.'):card('Inventory movement journal',table(['Date','SKU / batch','Movement','Quantity'],db.movements.map(m=>`<tr><td>${m.date}</td><td>${m.sku}</td><td>${esc(m.kind)}</td><td class="${m.qty<0?'negative':'positive'}">${m.qty>0?'+':''}${m.qty} ${m.unit||'units'}</td></tr>`).join('')),'Opening stock is the starting point; this journal shows sample receipts and subsequent prototype changes.')}`}
function shipping(){let os=db.orders.filter(o=>['Ready','Shipped','Failed Delivery','Returned','Partially Returned','Exchange'].includes(o.status));return heading('Shipping operations','Assign couriers, follow exceptions, and account for every delivery.',`<button onclick="go('orders')">Assign from orders →</button>`)+`<div class="grid thirds">${['Bosta','Mylerz','Internal driver'].map(name=>{let oo=db.orders.filter(o=>o.courier===name),attempt=oo.filter(o=>o.shipped),del=oo.filter(o=>finished.includes(o.status));return card(name,`<div class="pad"><div class="metricpair"><div><small>Delivered / attempted</small><strong>${del.length} / ${attempt.length}</strong></div><div><small>Delivery rate</small><strong>${Math.round(del.length/Math.max(attempt.length,1)*100)}%</strong></div></div><div class="row"><span>Unremitted net COD</span><strong>${egp(sum(oo,o=>Math.max(0,expected(o)-o.received)))}</strong></div><div class="row"><span>Delivery exceptions</span><strong>${oo.filter(o=>o.status==='Failed Delivery').length}</strong></div><button style="margin-top:14px" onclick="filters.courier='${name}';go('orders')">Inspect orders →</button></div>`,'Manual tracking · no API required')}).join('')}</div>${card('Dispatch & exception queue',table(['Order','Customer / area','Courier','Status','Shipping cost','Action'],os.map(o=>`<tr><td>${orderLink(o)}</td><td>${customer(o).name}<br><small>${customer(o).city}</small></td><td>${o.courier}</td><td>${badge(o.status)}</td><td>${egp(o.shipping)}</td><td><button onclick="statusModal(${o.id})">Update shipment</button></td></tr>`).join('')),'Ready orders can be dispatched; failed deliveries can be retried or returned.')}<div style="height:20px"></div>${card('Exchange service cases',table(['Case','Order','Reason','State','Action'],db.cases.map(c=>`<tr><td>${c.id}</td><td><button class="link" onclick="openOrder(${c.order})">#${c.order}</button></td><td>${esc(c.reason)}</td><td>${badge(c.status)}</td><td>${c.status==='Requested'?`<button onclick="caseModal('${c.id}')">Resolve case</button>`:'Resolution logged'}</td></tr>`).join('')),'Exchange requests are service cases. Replacement dispatch must be recorded as a separate order; case closure alone does not move stock.')}`}
function finance(){let m=metrics(),spend=sum(db.campaigns,c=>c.spend),expenses=sum(db.expenses,e=>e.amount),net=m.rev-m.cogs-m.shipping-m.fees-spend-expenses;return heading('Finance center','Reconcile courier cash and understand operating profitability.',`<button onclick="expenseModal()">+ Record expense</button><button onclick="exportFinance()">↓ Export summary</button>`)+`<div class="grid kpis">${metric('Recognized revenue',egp(m.rev),'Accrual view · retained delivered items')}${metric('Actual cash received',egp(m.cash),'Net courier remittances, after reversals')}${metric('Outstanding net COD',egp(sum(db.orders,o=>Math.max(0,expected(o)-o.received))),'Unreceived expected settlements')}${metric('Operating profit',egp(net),'Before tax · after all recorded costs')}</div><div class="tabs">${['Profit & loss','Reconciliation','Expenses','Cash ledger'].map(t=>`<button class="${financeTab===t?'active':''}" onclick="financeTab='${t}';render()">${t}</button>`).join('')}</div>${financeTab==='Profit & loss'?`<div class="grid cols">${card('Operating statement',`<div class="pad">${[['All order value (not recognized sales)',m.gross],['Recognized revenue',m.rev],['Cost of goods sold',-m.cogs],['Gross profit',m.rev-m.cogs],['Shipping / return logistics',-m.shipping],['Payment / COD fees',-m.fees],['Marketing spend',-spend],['Operating expenses',-expenses],['Operating profit before tax',net]].map(([l,v])=>`<div class="row"><span>${l}</span><strong class="${v<0?'negative':''}">${egp(v)}</strong></div>`).join('')}</div>`,'Entire sample period · 21 Oct–4 Nov 2026')}${card('Profit is different from cash',`<div class="pad"><div class="financebig"><span class="muted">Operating margin</span><strong>${(net/Math.max(m.rev,1)*100).toFixed(1)}%</strong><span class="muted">Operating profit ÷ recognized revenue</span></div><details open style="margin-top:20px"><summary>Calculation policy</summary><p>Revenue is recognized on delivery, net of discounts and accepted returns. Returned resellable units reverse COGS. Shipping and fees are costs even when a delivery fails.</p><p>Cash received is the net amount remitted by the courier. Shipping deductions are already excluded from this cash amount; they are deducted once in the profit statement, not twice.</p><p>Campaigns with no orders still incur spend in this company statement. No tax, depreciation, payables or bank integrations are modeled.</p></details></div>`)}</div>`:financeTab==='Reconciliation'?`<div class="note warning">Review the difference before marking an order reconciled. Status is calculated from expected net settlement and actual receipts; it cannot be manually forced.</div>${card('Settlement worksheet',table(['Order / courier','Recognized','Shipping + fees','Net expected','Net received','Gap','Result','Action'],db.orders.filter(o=>finished.includes(o.status)||o.received!==0).map(o=>`<tr><td>${orderLink(o)}<br><small>${o.courier}</small></td><td>${egp(revenue(o))}</td><td>${egp(o.shipping+o.fee)}</td><td>${egp(expected(o))}</td><td>${egp(o.received)}</td><td class="${Math.abs(expected(o)-o.received)>.01?'negative':'positive'}">${egp(expected(o)-o.received)}</td><td>${badge(collection(o))}</td><td><button onclick="settlementModal(${o.id})">Record</button></td></tr>`).join('')),'Positive gap = courier owes money. Negative gap = overpayment or refund review.')}`:financeTab==='Expenses'?card('Operating expense register',table(['Date','Description','Category','Amount'],db.expenses.map(e=>`<tr><td>${e.date}</td><td>${esc(e.name)}</td><td>${esc(e.category)}</td><td>${egp(e.amount)}</td></tr>`).join('')),'Expenses affect profit; payment timing is not modeled in the cash ledger.'):card('Net remittance ledger',table(['Date','Reference','Order','Cash movement'],db.orders.flatMap(o=>o.settlements.map(s=>({o,s}))).sort((a,b)=>b.s.date.localeCompare(a.s.date)).map(({o,s})=>`<tr><td>${s.date}</td><td>${esc(s.ref)}</td><td>${orderLink(o)}</td><td class="${s.amount<0?'negative':'positive'}">${egp(s.amount)}</td></tr>`).join('')),'Courier receipts and refund reversals only. This is not a complete bank or cash-flow statement.')}`}
function campaigns(){let focus=camp(campaignFocus);return heading('Campaign performance','Manually recorded spend. Order-level attribution. Measured outcomes.',`<button class="primary" onclick="campaignModal()">+ Create campaign</button>`)+`<div class="note">Automation is optional. Enter spend here, then assign the campaign on each order. Allocation: total campaign spend ÷ all attributed orders. This is an internal attribution model, not a claim of platform accuracy.</div><div class="grid thirds">${db.campaigns.map(c=>{let os=db.orders.filter(o=>o.campaign===c.id),m=metrics(os),con=m.rev-m.cogs-m.shipping-m.fees-c.spend;return card(esc(c.name),`<div class="pad">${badge(c.platform)} ${badge('Manual')}<div class="metricpair"><div><small>Recorded spend</small><strong>${egp(c.spend)}</strong></div><div><small>Delivered ROAS</small><strong>${c.spend?(m.rev/c.spend).toFixed(2)+'×':'—'}</strong></div></div><div class="bar"><i style="width:${Math.min(100,c.spend/Math.max(c.budget,1)*100)}%"></i></div><p class="inlinehelp">${egp(c.spend)} of ${egp(c.budget)} budget · ${c.start} → ${c.end}</p>${[['Attributed orders',os.length],['Retained delivery orders',os.filter(o=>finished.includes(o.status)).length],['Orders with returns',os.filter(o=>o.refundQty>0).length],['Net cash received',egp(m.cash)],['Campaign contribution',egp(con)]].map(([l,v])=>`<div class="row"><span>${l}</span><strong>${v}</strong></div>`).join('')}<div class="actions" style="margin-top:17px"><button onclick="campaignModal(${c.id})">Edit spend</button><button class="link" onclick="campaignFocus=${c.id};render()">View attribution →</button></div></div>`)}).join('')}</div>${card('Reported performance vs operational reality',table(['Campaign','Reported ROAS','Delivered ROAS','Net cash / spend','Cost / delivered order','Contribution'],db.campaigns.map(c=>{let os=db.orders.filter(o=>o.campaign===c.id),m=metrics(os),d=os.filter(o=>finished.includes(o.status)).length;return `<tr><td>${esc(c.name)}</td><td>${c.reported?c.reported.toFixed(1)+'×':'Not entered'}</td><td>${c.spend?(m.rev/c.spend).toFixed(2)+'×':'—'}</td><td>${c.spend?(m.cash/c.spend).toFixed(2)+'×':'—'}</td><td>${d?egp(c.spend/d):'—'}</td><td>${egp(m.rev-m.cogs-m.shipping-m.fees-c.spend)}</td></tr>`}).join('')),'Platform ROAS is sample manually reported data; cash/spend is a separate net collection ratio.')}<div style="height:20px"></div>${card(focus?`${esc(focus.name)} · attributed orders`:'Unassigned / organic orders',orderTable(db.orders.filter(o=>o.campaign===(focus?.id||0)),false),'Open an order to change its campaign.',focus?'<button onclick="campaignFocus=0;render()">View unassigned</button>':'')}`}
function settings(){return heading('Settings & data sources','A working operation with no integration dependency.',`<button onclick="downloadBackup()">↓ Download demo backup</button><button class="danger" onclick="resetModal()">Reset demo</button>`)+`<div class="grid equal">${card('Data entry modes',`<div class="pad">${Object.entries(db.settings.sources).map(([name,mode])=>`<div class="row"><div><strong>${name}</strong><p class="subtitle">${name==='Meta'?'Campaign spend & attribution':name==='Shopify'?'Orders & customer records':name==='Couriers'?'Delivery updates & deductions':'Collection reconciliation'}</p></div><select aria-label="${name} preferred input mode" onchange="sourceMode('${name}',this.value)">${opts(['Manual','CSV','API (planned)'],mode)}</select></div>`).join('')}<div class="note" style="margin-top:15px;margin-bottom:0">Modes are saved preferences only. Manual forms work now. Order CSV import/export works locally. API connectors and other CSV mappings are planned.</div></div>`)}${card('Operational rules',`<form id="rulesForm" class="pad" onsubmit="saveRules(event)"><label class="field">Workspace name<input name="company" required maxlength="80" value="${esc(db.settings.company)}"></label><label class="field" style="margin-top:14px">Reconciliation tolerance (EGP)<input type="number" min="0" max="20" step="0.01" name="tolerance" value="${db.settings.tolerance}" required></label><div class="row"><span>Currency / timezone</span><strong>EGP / Africa–Cairo</strong></div><div class="row"><span>Revenue recognition</span><strong>Delivered, net of returns</strong></div><div class="row"><span>Marketing allocation</span><strong>Equal per attributed order</strong></div><div class="row"><span>Warehouse</span><strong>Cairo · single location</strong></div><button class="primary" style="margin-top:15px">Save rules</button></form>`)}</div><div class="grid equal">${card('Roles & permissions blueprint',table(['Capability','Owner','Operations','Finance'],[['Orders & shipping','Full','Edit','View'],['Customer records','Full','Edit','View'],['Inventory & production','Full','Edit','View'],['Collections / spend','Full','View','Edit'],['Settings / access','Full','—','—']].map(r=>`<tr>${r.map(x=>'<td>'+x+'</td>').join('')}</tr>`).join('')),'Design specification only. This standalone file has no authentication or enforced access control.')}${card('Data integrity & scope',`<div class="pad"><details open><summary>What this prototype enforces</summary><p>Positive order quantities, available stock at confirmation, valid lifecycle transitions, unique payment references per order, return limits and one-time production completion. Inputs are rendered as text.</p></details><details style="margin-top:18px"><summary>What production needs next</summary><p>Server persistence, access control, immutable accounting journal, tax rules, multi-item orders, damaged returns, split shipments, multi-warehouse stock, import deduplication across external IDs, and backups.</p></details><details style="margin-top:18px"><summary>CSV contract</summary><p>Use Orders → Import CSV for a downloadable template. Each row creates one new single-SKU order using existing customer and product IDs. Validation is all-or-nothing. File size is limited to 1 MB / 500 rows.</p></details></div>`)}</div>${card('Activity audit',table(['When','Action'],db.audit.slice(0,30).map(a=>`<tr><td>${esc(a.date)}</td><td style="white-space:normal">${esc(a.text)}</td></tr>`).join('')),'Local demo history · not an immutable security audit.')}`}
const phases=[{id:0,name:'Foundation & shared records',tag:'Design baseline',goal:'Agree on the data contract before building modules.',items:['Customer, SKU, order, campaign, shipment and settlement identifiers','Separate order state, payment state and financial recognition','Versioned price/COGS snapshots; source and operator audit'],gate:'One order can be traced from creation to contribution without duplicate records.',dep:'None'}, {id:1,name:'Core order operations',tag:'MVP / first release',goal:'Run daily operations manually from one workspace.',items:['Manual single- and multi-item order capture plus validated CSV import','Confirmation, reservation, packing and dispatch queues','CRM profile, notes, addresses, search and role permissions'],gate:'Team can process a full day of orders without an external spreadsheet.',dep:'Foundation'}, {id:2,name:'Shipping & cash control',tag:'MVP / second release',goal:'Account for deliveries, returns and every courier remittance.',items:['Courier assignment, retry queue, partial delivery and exchanges','Settlement batches, deductions, refunds and discrepancy ownership','Resellable vs damaged return inspection with stock movements'],gate:'A courier statement reconciles to orders; every difference has an owner.',dep:'Core order operations'}, {id:3,name:'Finance & campaign economics',tag:'Next',goal:'Make profit and cash independently explainable.',items:['Accrual P&L, collections ledger, expenses and tax policy','Manual campaign budgets/spend and explicit attribution model','Order, product, campaign and customer profitability'],gate:'Order contribution reconciles to company profit including unallocated spend.',dep:'Shipping & cash control'}, {id:4,name:'Inventory & production depth',tag:'Next',goal:'Connect purchasing and production to true product costs.',items:['BOM versions, purchasing, batches, material reservations and scrap','Raw materials → WIP → finished goods; multi-warehouse transfers','Actual vs standard costing, landed cost and reorder planning'],gate:'A production batch reconciles material usage, labor, losses and received units.',dep:'Stable order and finance contracts'}, {id:5,name:'Selective automation',tag:'Optional',goal:'Automate only proven sources of time savings and error reduction.',items:['Shopify order intake with idempotency and reconciliation','Courier webhooks with retry, conflict handling and manual override','Optional Meta spend import; payments and accounting exports'],gate:'Disconnecting an integration does not prevent manual operation.',dep:'Reliable manual workflow and source ownership'}, {id:6,name:'Intelligence & planning',tag:'Later',goal:'Use trusted operational history to improve decisions.',items:['Demand and cash forecasts with explicit uncertainty','Return drivers by SKU, campaign, courier and region','Alerts with thresholds, ownership and a measurable action'],gate:'Recommendations are explainable and evaluated against actual outcomes.',dep:'Sufficient clean historical data'}];
function roadmap(){return heading('Build the operation. Then automate.','A phased delivery plan with dependencies and clear acceptance gates.')+`<div class="note">This prototype previews all phases. It is not evidence that the production backend, integrations or access controls have been built. Checkboxes below track your local review decisions.</div><div class="grid equal">${phases.map(p=>`<section class="card phase"><div class="cardhead"><div><div class="eyebrow">PHASE ${p.id}</div><h2>${p.name}</h2></div>${badge(p.tag)}</div><div class="pad"><p>${p.goal}</p><ul>${p.items.map(x=>'<li>'+x+'</li>').join('')}</ul><div class="note" style="margin:14px 0"><strong>Acceptance gate</strong><br>${p.gate}</div><p class="subtitle">Depends on: ${p.dep}</p><label class="checkrow"><input type="checkbox" ${db.milestones[p.id]?'checked':''} onchange="db.milestones[${p.id}]=this.checked;save('Roadmap review updated')">Scope reviewed and accepted</label></div></section>`).join('')}</div>`}
const views={overview,orders,order360,crm,inventory,shipping,finance,campaigns,settings,roadmap};
function modal(title,body,submit,label='Save'){let d=document.getElementById('dialog');d.innerHTML=`<form id="modalForm"><div class="cardhead"><h2 id="modalTitle">${title}</h2><button type="button" aria-label="Close dialog" onclick="closeModal()">×</button></div><div class="body">${body}<p id="formError" class="negative" role="alert" style="margin-top:12px"></p></div><footer><button type="button" onclick="closeModal()">Cancel</button><button class="primary" type="submit">${label}</button></footer></form>`;document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();try{let f=Object.fromEntries(new FormData(e.target));if(submit(f)!==false)closeModal()}catch(err){document.getElementById('formError').textContent=err.message}};d.showModal()}
function closeModal(){document.getElementById('dialog').close()}
function field(label,name,type='text',value='',extra=''){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra} required></label>`}
function selectField(label,name,options){return `<label class="field">${label}<select name="${name}">${options}</select></label>`}
function newOrder(){modal('Create manual order',`<div class="note">Single-SKU prototype order. Stock reserves when confirmed. Customer and campaign records are shared across the workspace.</div><div class="formgrid">${selectField('Customer','customer',db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(''))}${selectField('Product / variant','product',db.products.map(p=>`<option value="${p.id}">${p.name} · ${p.variant} · ${egp(p.price)}</option>`).join(''))}${field('Quantity','qty','number',1,'min="1" max="100" step="1"')}${field('Discount (EGP)','discount','number',0,'min="0" step="0.01"')}${selectField('Sales channel','channel',opts(['Phone','Instagram','WhatsApp','Shopify CSV'],'Phone'))}${selectField('Campaign','campaign',`<option value="0">Organic / unassigned</option>`+db.campaigns.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(''))}${selectField('Courier','courier',opts(['Bosta','Mylerz','Internal driver'],'Bosta'))}${field('Order date','date','date','2026-11-04')}<label class="field full">Internal note<textarea name="note" maxlength="500"></textarea></label></div>`,f=>{let o=makeOrder(f,'Manual');db.orders.unshift(o);selected=o.id;page='order360';save(`Order #${o.id} created manually`)},'Create order')}
function makeOrder(f,source){let p=db.products.find(p=>p.id===f.product),q=Number(f.qty),d=Number(f.discount||0);if(!p||!db.customers.some(c=>c.id===Number(f.customer)))throw Error('Select a valid existing customer and product.');if(!Number.isInteger(q)||q<1||q>100||!Number.isFinite(d)||d<0||d>p.price*q)throw Error('Quantity must be 1–100; discount cannot exceed the order value.');if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date)||Number.isNaN(Date.parse(f.date))||new Date(f.date).toISOString().slice(0,10)!==f.date)throw Error('Enter a valid date.');let campaign=Number(f.campaign||0);if(campaign&&!camp(campaign))throw Error('Unknown campaign ID.');if(!['Bosta','Mylerz','Internal driver'].includes(f.courier))throw Error('Choose Bosta, Mylerz or Internal driver.');return {id:Math.max(...db.orders.map(o=>o.id),1057)+1,customer:Number(f.customer),product:p.id,qty:q,price:p.price,unitCost:p.cost,discount:d,status:'New',refundQty:0,source,channel:f.channel||'CSV',campaign,courier:f.courier,shipping:0,fee:0,received:0,date:f.date,shipped:false,restocked:0,notes:f.note?[f.note]:[],settlements:[],events:[{date:f.date,text:'Created via '+source}]}}
const transitions={'New':['Confirmed','Cancelled'],'Confirmed':['Processing','Cancelled'],'Processing':['Ready','Cancelled'],'Ready':['Shipped','Cancelled'],'Shipped':['Delivered','Failed Delivery','Returned'],'Failed Delivery':['Shipped','Returned'],'Delivered':[],'Partially Returned':[],'Returned':[],'Exchange':[],'Cancelled':[]};
function transition(o,target){if(!transitions[o.status]?.includes(target))throw Error(`#${o.id}: ${o.status} cannot move directly to ${target}.`);let p=product(o);if(target==='Confirmed'&&available(p)<o.qty)throw Error(`#${o.id}: only ${available(p)} units available.`);if(target==='Shipped'&&!o.shipped){if(p.stock<o.qty)throw Error('Insufficient physical stock.');p.stock-=o.qty;o.shipped=true;o.shipping=75;db.movements.unshift({date:'2026-11-04',sku:p.id,qty:-o.qty,kind:'Dispatch #'+o.id})}if(target==='Delivered')o.fee=15;if(target==='Returned'){let n=o.qty-o.restocked;p.stock+=n;o.restocked+=n;o.refundQty=o.qty;o.shipping+=40;db.movements.unshift({date:'2026-11-04',sku:p.id,qty:n,kind:'Return receipt #'+o.id})}o.status=target;o.events.push({date:'2026-11-04',text:'Status changed to '+target})}
function statusModal(id){let o=db.orders.find(o=>o.id===id),next=transitions[o.status]||[];if(!next.length){toast('Use the return or exchange workflow for this order.');return}modal('Update order #'+id,`<div class="note">Current: ${o.status}. Dispatch charges EGP 75 shipping; delivery adds EGP 15 COD fee. A failed-shipment return restores stock and adds EGP 40 return logistics.</div>${selectField('Next state','status',opts(next,next[0]))}`,f=>{transition(o,f.status);save(`Order #${id} moved to ${f.status}`)},'Update status')}
function bulkConfirm(){if(!selectedOrders.size)return toast('Select one or more orders first.');let ok=0,skip=0;db.orders.filter(o=>selectedOrders.has(o.id)).forEach(o=>{try{transition(o,'Confirmed');ok++}catch{skip++}});selectedOrders.clear();save(`${ok} orders confirmed; ${skip} skipped (state or insufficient stock)`)}
function bulkCourier(){if(!selectedOrders.size)return toast('Select one or more orders first.');courierModal([...selectedOrders])}
function courierModal(ids){modal('Assign courier',`<div class="note">Only orders before dispatch can be reassigned here. Existing shipments keep their courier history.</div>${selectField('Courier / driver','courier',opts(['Bosta','Mylerz','Internal driver'],'Bosta'))}`,f=>{let n=0;db.orders.filter(o=>ids.includes(o.id)&&['New',...active].includes(o.status)).forEach(o=>{o.courier=f.courier;o.events.push({date:'2026-11-04',text:'Assigned to '+f.courier});n++});save(`${n} orders assigned to ${f.courier}; ${ids.length-n} skipped`)},'Assign')}
function settlementModal(id){let o=db.orders.find(o=>o.id===id);if(!finished.includes(o.status)&&o.received===0)return toast('Collections are recorded after delivery. No collection is due yet.');modal('Record settlement · #'+id,`<div class="note">Expected ${egp(expected(o))} · received ${egp(o.received)} · gap ${egp(expected(o)-o.received)}. Enter the additional net remittance, not the cumulative total.</div><div class="formgrid">${field('Net amount (negative for refund)','amount','number',Math.round((expected(o)-o.received)*100)/100,'step="0.01"')}${field('Payment / bank reference','ref','text','','maxlength="80"')}${field('Receipt date','date','date','2026-11-04')}</div><p class="inlinehelp">Negative entries reverse cash already received. This logs a payment; it does not transfer money.</p>`,f=>{let amount=Number(f.amount);if(!Number.isFinite(amount)||amount===0)throw Error('Enter a non-zero amount.');if(o.received+amount<0)throw Error('A reversal cannot exceed cash received.');if(!f.ref.trim()||o.settlements.some(s=>s.ref.toLowerCase()===f.ref.trim().toLowerCase()))throw Error('Use a new, non-empty reference for this order.');o.received=Math.round((o.received+amount)*100)/100;o.settlements.push({amount,ref:f.ref.trim(),date:f.date});o.events.push({date:f.date,text:`Net remittance ${egp(amount)} · ${f.ref.trim()}`});save(`Settlement recorded for #${id} · ${collection(o)}`)},'Record payment')}
function returnModal(id){let o=db.orders.find(o=>o.id===id);if(!finished.includes(o.status))return toast('Returns can be accepted after delivery. For failed shipments, update status to Returned.');let max=o.qty-o.refundQty;modal('Accept resellable return · #'+id,`<div class="note warning">This records an inspected, resellable return. Revenue and COGS reverse for the returned units; stock increases. Cash refund is a separate negative collection entry.</div><div class="formgrid">${field('Additional units returned','qty','number',1,`min="1" max="${max}" step="1"`)}${field('Additional return shipping','cost','number',40,'min="0" step="0.01"')}${field('Return reason','reason','text','','maxlength="200"')}</div>`,f=>{let q=Number(f.qty),cost=Number(f.cost);if(!Number.isInteger(q)||q<1||q>max||!Number.isFinite(cost)||cost<0)throw Error('Invalid quantity or cost.');o.refundQty+=q;o.restocked+=q;product(o).stock+=q;o.shipping+=cost;o.status=o.refundQty===o.qty?'Returned':'Partially Returned';db.movements.unshift({date:'2026-11-04',sku:o.product,qty:q,kind:'Accepted return #'+id});o.events.push({date:'2026-11-04',text:`Accepted ${q} returned unit(s): ${f.reason}`});save(`Return accepted for #${id}; review any cash refund`)},'Accept return')}
function exchangeModal(id){let o=db.orders.find(o=>o.id===id);if(!['Delivered','Partially Returned'].includes(o.status))return toast('An exchange request requires a delivered order.');if(db.cases.some(c=>c.order===id&&c.status==='Requested'))return toast('This order already has an open exchange case.');modal('Request exchange · #'+id,`${field('Requested change / reason','reason','text','','maxlength="200"')}<p class="inlinehelp">Creates a service case only. Record the returned item and replacement order separately after inspection.</p>`,f=>{o.status='Exchange';db.cases.push({id:'EX-'+String(db.cases.length+1).padStart(3,'0'),order:id,reason:f.reason,status:'Requested'});o.events.push({date:'2026-11-04',text:'Exchange requested: '+f.reason});save('Exchange request created')},'Create request')}
function caseModal(id){let c=db.cases.find(c=>c.id===id);modal('Resolve exchange '+id,`${field('Resolution / replacement order reference','reason','text','','maxlength="250"')}<p class="inlinehelp">Closing this case records the resolution only. It does not create a replacement shipment or adjust inventory.</p>`,f=>{c.status='Resolved';c.reason+=' · Resolution: '+f.reason;let o=db.orders.find(o=>o.id===c.order);if(o.status==='Exchange')o.status=o.refundQty?'Partially Returned':'Delivered';o.events.push({date:'2026-11-04',text:'Exchange resolved: '+f.reason});save(id+' resolved')},'Resolve case')}
function attributionModal(id){let o=db.orders.find(o=>o.id===id);modal('Edit attribution · #'+id,`${selectField('Campaign','campaign',[{id:0,name:'Organic / unassigned'},...db.campaigns].map(c=>`<option value="${c.id}" ${o.campaign===c.id?'selected':''}>${esc(c.name)}</option>`).join(''))}<p class="inlinehelp">Changing attribution recalculates cost allocation for every order in the old and new campaigns.</p>`,f=>{o.campaign=Number(f.campaign);o.events.push({date:'2026-11-04',text:'Campaign assigned: '+campaignName(o.campaign)});save('Campaign attribution updated')})}
function noteModal(type,id){modal(type==='order'?'Add order note':'Log customer contact',`<label class="field">Internal note<textarea name="note" required maxlength="1000" placeholder="Record a call, preference, or follow-up…"></textarea></label>`,f=>{if(!f.note.trim())throw Error('Enter a note.');if(type==='order'){let o=db.orders.find(o=>o.id===id);o.notes.push(f.note.trim());o.events.push({date:'2026-11-04',text:'Internal note added'})}else db.customers.find(c=>c.id===id).notes.push({text:f.note.trim(),date:'2026-11-04'});save('Internal note saved')})}
function setTag(id,tag){db.customers.find(c=>c.id===id).tag=tag;save('Customer segment updated')}
function stockModal(){modal('Adjust physical stock',`<div class="formgrid">${selectField('Product','product',db.products.map(p=>`<option value="${p.id}">${p.id} · ${p.name}</option>`).join(''))}${field('Adjustment (+ / − units)','qty','number',1,'step="1"')}${field('Reason','reason','text','','maxlength="150"')}</div>`,f=>{let p=db.products.find(p=>p.id===f.product),n=Number(f.qty);if(!Number.isInteger(n)||!n||p.stock+n<reserved(p))throw Error('Enter a non-zero integer; remaining stock must cover reservations.');p.stock+=n;db.movements.unshift({date:'2026-11-04',sku:p.id,qty:n,kind:'Manual adjustment: '+f.reason});save('Stock adjusted for '+p.id)})}
function batchModal(){modal('Create production order',`<div class="formgrid">${selectField('Product','product',db.products.map(p=>`<option value="${p.id}">${p.id} · ${p.name}</option>`).join(''))}${field('Units to produce','qty','number',10,'min="1" max="500" step="1"')}${field('Due date','due','date','2026-11-08')}</div><p class="inlinehelp">A planned batch does not consume materials until started.</p>`,f=>{let q=Number(f.qty);if(!Number.isInteger(q)||q<1||q>500)throw Error('Use 1–500 units.');db.batches.push({id:'MO-'+(201+db.batches.length),product:f.product,qty:q,status:'Planned',due:f.due});inventoryTab='Production';save('Production order created')})}
function advanceBatch(id){let b=db.batches.find(b=>b.id===id),p=db.products.find(p=>p.id===b.product);if(b.status==='Planned'){let needs=[p.bom*b.qty,b.qty,b.qty];if(needs.some((n,i)=>db.materials[i].stock<n))return toast('Insufficient raw materials to start this batch.');needs.forEach((n,i)=>{db.materials[i].stock-=n;db.movements.unshift({date:'2026-11-04',sku:b.id,qty:-n,kind:db.materials[i].name+' consumed',unit:i===0?'m':'kits'})});b.status='WIP';save(id+' started; materials consumed')}else if(b.status==='WIP'){p.stock+=b.qty;b.status='Completed';db.movements.unshift({date:'2026-11-04',sku:p.id,qty:b.qty,kind:'Production receipt '+id});save(id+' completed; finished stock received')}}
function expenseModal(){modal('Record operating expense',`<div class="formgrid">${field('Description','name','text','','maxlength="150"')}${selectField('Category','category',opts(['Operations','Overheads','Utilities','Other'],'Operations'))}${field('Amount (EGP)','amount','number','','min="0.01" step="0.01"')}${field('Expense date','date','date','2026-11-04')}</div>`,f=>{if(!(Number(f.amount)>0))throw Error('Amount must be positive.');db.expenses.push({id:Date.now(),...f,amount:Number(f.amount)});save('Operating expense recorded')})}
function campaignModal(id){let c=camp(id)||{name:'',platform:'Meta',spend:0,budget:5000,start:'2026-11-04',end:'2026-11-30',reported:0};modal(id?'Edit campaign & total spend':'Create campaign',`<div class="formgrid">${field('Campaign name','name','text',c.name,'maxlength="100"')}${selectField('Platform','platform',opts(['Meta','Instagram','WhatsApp','Google','Other'],c.platform))}${field('Total spend to date (EGP)','spend','number',c.spend,'min="0" step="0.01"')}${field('Budget (EGP)','budget','number',c.budget,'min="0" step="0.01"')}${field('Start date','start','date',c.start)}${field('End date','end','date',c.end)}${field('Reported platform ROAS (0 = none)','reported','number',c.reported,'min="0" step="0.1"')}</div><p class="inlinehelp">This replaces total recorded spend; it is not an incremental spend entry. All attributed order contributions recalculate.</p>`,f=>{if(f.end<f.start)throw Error('End date must be on or after start date.');let x={...f,spend:Number(f.spend),budget:Number(f.budget),reported:Number(f.reported)};if([x.spend,x.budget,x.reported].some(n=>!Number.isFinite(n)||n<0))throw Error('Spend, budget and ROAS must be non-negative.');if(!f.name.trim())throw Error('Enter a campaign name.');if(id)Object.assign(c,x);else db.campaigns.push({id:Math.max(0,...db.campaigns.map(c=>c.id))+1,...x});save('Campaign saved with manual spend')})}
function sourceMode(name,value){db.settings.sources[name]=value;save(name+' preference saved'+(value==='API (planned)'?' — no live API connection':''))}
function saveRules(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));db.settings.company=f.company;db.settings.tolerance=Number(f.tolerance);save('Operational rules saved')}
function resetModal(){modal('Reset demo workspace?',`<p>This replaces your local changes with the original fictional dataset. Download a backup first if you want to keep your work.</p>`,()=>{db=seed();selected=1058;selectedOrders.clear();save('Demo reset to original sample data')},'Reset demo')}
function download(name,text,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function csvCell(v){let s=String(v??'');if(/^[=+@\-]/.test(s)&&typeof v!=='number')s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}function csv(rows){return rows.map(r=>r.map(csvCell).join(',')).join('\r\n')}
function exportOrders(){let rows=[['order_id','date','customer','sku','qty','status','courier','campaign','order_value','recognized_revenue','cogs','shipping','fees','marketing_allocation','contribution','expected_net','received_net','collection_state'],...filteredOrders().map(o=>[o.id,o.date,customer(o).name,o.product,o.qty,o.status,o.courier,campaignName(o.campaign),gross(o),revenue(o),cogs(o),o.shipping,o.fee,allocation(o).toFixed(2),contribution(o).toFixed(2),expected(o),o.received,collection(o)])];download('commerce-orders.csv',csv(rows),'text/csv');toast('Filtered orders exported')}
function exportFinance(){let m=metrics(),ads=sum(db.campaigns,c=>c.spend),exp=sum(db.expenses,e=>e.amount);download('commerce-finance.csv',csv([['metric','EGP'],['Recognized revenue',m.rev],['COGS',m.cogs],['Shipping',m.shipping],['Fees',m.fees],['Campaign spend',ads],['Operating expenses',exp],['Operating profit',m.rev-m.cogs-m.shipping-m.fees-ads-exp],['Net cash received',m.cash],['Net expected settlement',m.expected]]),'text/csv')}
function downloadBackup(){download('commerce-os-demo-backup.json',JSON.stringify(db,null,2),'application/json');toast('Local data snapshot downloaded')}
function template(){download('new-orders-template.csv','customer,product,qty,discount,channel,campaign,courier,date\n1,LIN-SND,1,0,Phone,1,Bosta,2026-11-04\n2,TEE-IVR,2,0,Instagram,2,Mylerz,2026-11-04','text/csv')}
function parseCSV(text){let rows=[],row=[],cell='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quote)throw Error('CSV contains an unclosed quotation mark.');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
let importRows=[];
function importModal(){importRows=[];modal('Import new orders from CSV',`<div class="note">Use existing customer IDs (1–12), SKUs and campaign IDs (0 = unassigned). Each row creates a New order. This importer is for new orders, not updates; importing the same file again creates duplicates.</div><button type="button" onclick="template()">↓ Download template</button><label class="field" style="margin-top:18px">Choose CSV (max 1 MB / 500 orders)<input id="csvFile" type="file" accept=".csv,text/csv" onchange="previewImport(this.files[0])" required></label><div id="importPreview" style="margin-top:15px"></div>`,()=>{if(!importRows.length)throw Error('Choose and validate a CSV file first.');let next=Math.max(...db.orders.map(o=>o.id))+1;importRows.forEach(o=>{o.id=next++;db.orders.unshift(o)});save(`${importRows.length} orders imported from CSV`);importRows=[]},'Import validated rows')}
async function previewImport(file){importRows=[];let el=document.getElementById('importPreview');try{if(!file)return;if(file.size>1e6)throw Error('File exceeds 1 MB.');let rows=parseCSV((await file.text()).replace(/^\uFEFF/,'')),headers=rows.shift()?.map(h=>h.trim());let required=['customer','product','qty','discount','channel','campaign','courier','date'];if(!headers||required.some(h=>!headers.includes(h)))throw Error('Use all columns from the downloadable template.');if(!rows.length||rows.length>500)throw Error('Use 1–500 data rows.');let prepared=rows.map((r,i)=>{try{if(r.length!==headers.length)throw Error('Column count does not match the header.');return makeOrder(Object.fromEntries(headers.map((h,j)=>[h,r[j].trim()])),'CSV')}catch(e){throw Error(`Row ${i+2}: ${e.message}`)}});importRows=prepared;el.innerHTML=`<div class="note">${prepared.length} valid new orders · Total ${egp(sum(prepared,gross))}. Ready to import.</div>`+table(['Customer','SKU','Qty'],prepared.slice(0,5).map(o=>`<tr><td>${customer(o).name}</td><td>${o.product}</td><td>${o.qty}</td></tr>`).join(''));document.getElementById('formError').textContent=''}catch(e){el.textContent=e.message;el.className='negative'}}
page=navItems.some(n=>n[0]===location.hash.slice(1))?location.hash.slice(1):'overview';render();
</script></body></html>
